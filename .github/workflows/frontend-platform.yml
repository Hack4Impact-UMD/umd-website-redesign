name: Frontend platform

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend-firebase/firebase.json'
      - 'backend-firebase/.firebaserc'
      - 'netlify.toml'
      - '.gitignore'
      - '.github/workflows/frontend-platform.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Audit production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - name: Typecheck, unit test, and build
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Ensure build output is ignored
        run: test -z "$(git status --porcelain)"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install deterministic browser runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run fixture-backed browser smoke tests
        run: npm --prefix frontend run test:e2e
