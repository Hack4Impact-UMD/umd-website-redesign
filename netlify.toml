[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node >=22.12.
  NODE_VERSION = "22"
  # Absolute base for server-side content fetching during the build. A
  # same-origin /api path cannot be resolved outside a browser, so this is
  # required rather than optional.
  #
  # Lives here rather than in the Netlify UI because the same Function URL is
  # already hardcoded in the redirect below: splitting the two across a file
  # and a dashboard means a host change silently updates one and not the other.
  # Note netlify.toml wins over UI-set variables, so overriding this is a code
  # change by design.
  API_BASE_URL = "https://us-central1-umd-website-f3e79.cloudfunctions.net/api"

# The browser still fetches /api/media/* through this proxy: Storage rules deny
# public reads, so images are served by the Function. Build-time content fetches
# go direct via API_BASE_URL above and do not pass through here. The two must
# point at the same Function; deployment-config.test.ts asserts that.
[[redirects]]
  from = "/api/*"
  to = "https://us-central1-umd-website-f3e79.cloudfunctions.net/api/:splat"
  status = 200
  force = true

# No SPA fallback: every route is prerendered to its own HTML file, and Netlify
# serves dist/404.html with a real 404 for anything unmatched.
